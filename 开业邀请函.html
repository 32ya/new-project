<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司开业邀请函</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .invitation {
            width: 210mm;
            height: 297mm;
            background: linear-gradient(135deg, #fff 0%, #faf8f5 100%);
            padding: 60px 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* 装饰边框 */
        .invitation::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 2px solid #c9a96e;
            pointer-events: none;
        }

        .invitation::after {
            content: '';
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            border: 1px solid #e0d0b0;
            pointer-events: none;
        }

        /* 顶部装饰 */
        .header-decoration {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-decoration .line {
            display: inline-block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c9a96e, transparent);
            margin: 0 15px;
            vertical-align: middle;
        }

        .header-decoration .diamond {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #c9a96e;
            transform: rotate(45deg);
            vertical-align: middle;
        }

        /* 标题 */
        .title {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            color: #8b4513;
            letter-spacing: 12px;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(139, 69, 19, 0.1);
        }

        /* 称呼 */
        .salutation {
            font-size: 18px;
            color: #333;
            margin-bottom: 25px;
            text-indent: 2em;
        }

        /* 正文 */
        .content {
            font-size: 16px;
            line-height: 2;
            color: #444;
            text-indent: 2em;
            margin-bottom: 30px;
        }

        /* 信息区块 */
        .info-section {
            background: rgba(201, 169, 110, 0.08);
            padding: 25px 30px;
            margin: 30px 0;
            border-left: 3px solid #c9a96e;
        }

        .info-item {
            display: flex;
            margin-bottom: 12px;
            font-size: 15px;
            align-items: center;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #8b4513;
            font-weight: bold;
            min-width: 80px;
        }

        .info-value {
            color: #333;
            flex: 1;
        }

        /* 公司简介 */
        .company-intro {
            font-size: 15px;
            color: #555;
            text-indent: 2em;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* 底部 */
        .footer {
            margin-top: 50px;
            text-align: right;
            padding-right: 20px;
        }

        .company-name {
            font-size: 18px;
            color: #8b4513;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .date {
            font-size: 15px;
            color: #666;
        }

        /* 底部装饰 */
        .footer-decoration {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .footer-decoration .line {
            display: inline-block;
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a96e, transparent);
            margin: 0 10px;
            vertical-align: middle;
        }

        .footer-decoration .star {
            display: inline-block;
            color: #c9a96e;
            font-size: 12px;
            vertical-align: middle;
        }

        /* 输入框样式 */
        input[type="text"] {
            border: none;
            border-bottom: 1px solid #8b4513;
            background: transparent;
            font-family: inherit;
            font-size: inherit;
            color: #8b4513;
            font-weight: bold;
            outline: none;
            padding: 0 5px;
            min-width: 120px;
            text-align: center;
        }

        input[type="text"]:focus {
            border-bottom-color: #c9a96e;
            background: rgba(201, 169, 110, 0.1);
        }

        input[type="text"]::placeholder {
            color: #ccc;
            font-weight: normal;
        }

        /* 打印样式 */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .invitation {
                box-shadow: none;
                width: 210mm;
                height: 297mm;
            }
            input[type="text"] {
                border-bottom: 1px solid #8b4513;
            }
        }
    </style>
</head>
<body>
    <div class="invitation">
        <!-- 顶部装饰 -->
        <div class="header-decoration">
            <span class="line"></span>
            <span class="diamond"></span>
            <span class="line"></span>
        </div>

        <!-- 标题 -->
        <h1 class="title">开业邀请函</h1>

        <!-- 称呼 -->
        <p class="salutation">尊敬的 <input type="text" placeholder="嘉宾姓名" style="width: 150px;">：</p>

        <!-- 正文 -->
        <p class="content">
            承蒙各界朋友的关心与支持，<input type="text" placeholder="公司名称" style="width: 180px;"> 即将盛大开业。在此，我们诚挚地邀请您拨冗出席，共同见证这一重要时刻。
        </p>

        <!-- 信息区块 -->
        <div class="info-section">
            <div class="info-item">
                <span class="info-label">活动时间</span>
                <span class="info-value"><input type="text" placeholder="年/月/日 星期 时间" style="width: 100%; max-width: 350px;"></span>
            </div>
            <div class="info-item">
                <span class="info-label">活动地点</span>
                <span class="info-value"><input type="text" placeholder="详细地址" style="width: 100%; max-width: 350px;"></span>
            </div>
            <div class="info-item">
                <span class="info-label">活动流程</span>
                <span class="info-value">签到 → 开业典礼 → 参观交流 → 答谢午宴</span>
            </div>
        </div>

        <!-- 公司简介 -->
        <p class="company-intro">
            <input type="text" placeholder="公司名称" style="width: 160px;"> 是一家专注于 <input type="text" placeholder="主营业务领域" style="width: 160px;"> 领域的企业，致力于为客户提供专业、优质的服务。我们期待与您携手合作，共创美好未来。
        </p>

        <!-- 底部 -->
        <div class="footer">
            <p class="company-name"><input type="text" placeholder="公司名称" style="width: 180px;"> 敬邀</p>
            <p class="date"><input type="text" placeholder="年/月/日" style="width: 150px;"></p>
        </div>

        <!-- 底部装饰 -->
        <div class="footer-decoration">
            <span class="line"></span>
            <span class="star">✦</span>
            <span class="line"></span>
        </div>
    </div>
</body>
</html>
